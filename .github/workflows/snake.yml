name: Generate Snake Animation

on:
  schedule: # Roda automaticamente a cada 24 horas
    - cron: "0 0 * * *" 
  workflow_dispatch: # Permite rodar manualmente a qualquer momento
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: GuilhermeSantosGuimaraes
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#00FF00&color_dots=#000000,#003300,#006600,#009900,#00FF00
            dist/github-contribution-grid-snake-dark.svg?color_snake=#00FF00&color_dots=#000000,#003300,#006600,#009900,#00FF00
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
